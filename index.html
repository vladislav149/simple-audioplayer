<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/simple-audioplayer/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
    <script type="module" crossorigin src="/simple-audioplayer/assets/index-voKbvwHo.js"></script>
    <link rel="stylesheet" crossorigin href="/simple-audioplayer/assets/index-CyIH-SJI.css">
  </head>
  <body>
    <div class="audio-inner">
      <input type="file" class="audio-upload" accept="audio/*" hidden />
      <button class="upload-button">Выбрать трек</button>
      <button class="audio-start">start</button>
      <div class="audio-line">
        <div class="audio-inner-line" style="width: 0"></div>
      </div>
      <button class="audio-pause">pause</button>
      <div class="audio-volume">
        <button class="audio-button-volume">volume</button>
        <input
          type="range"
          class="audio-input-volume"
          min="0"
          max="1"
          step="0.01"
          value="1"
        />
      </div>
    </div>
  </body>
</html>
