<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
  </head>
  <body>
    <div class="audio-inner">
      <input type="file" class="audio-upload" accept="audio/*" hidden />
      <button class="upload-button" aria-label="upload">
        <img src="src/icons/upload.svg" alt="upload" />
      </button>
      <button class="audio-start" aria-label="play">
        <img src="src/icons/play.svg" alt="play" />
      </button>
      <div class="audio-line">
        <div class="audio-inner-line" style="width: 0"></div>
      </div>
      <button class="audio-pause" aria-label="pause">
        <img src="src/icons/pause.svg" alt="pause" />
      </button>
      <div class="audio-volume">
        <button class="audio-button-volume" aria-label="volume">
          <img src="src/icons/volume.svg" alt="volume" />
        </button>
        <input
          type="range"
          class="audio-input-volume"
          min="0"
          max="1"
          step="0.01"
          value="1"
        />
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
